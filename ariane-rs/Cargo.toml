# CH-064 : espace Cargo de la réécriture d'Ariane en Rust. Hors paquet (tools/package.py exclut ariane-rs/).
[workspace]
resolver = "2"
members = ["crates/ariane-js", "crates/ariane-vba", "crates/ariane-capture", "crates/ariane-geometrie", "crates/ariane-lidar", "crates/ariane-decision", "crates/ariane-etat", "crates/ariane-coeur", "crates/ariane-hote"]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
