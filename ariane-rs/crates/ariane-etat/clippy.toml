  { path = "f64::tan", reason = "transcendante : import JS" },
  { path = "f64::atan2", reason = "transcendante : import JS" },
  { path = "f64::exp", reason = "transcendante : import JS" },
  { path = "f64::ln", reason = "transcendante : import JS" },
  { path = "f64::ln_1p", reason = "transcendante : import JS" },
  { path = "f64::log10", reason = "transcendante : import JS" },
  { path = "f64::powf", reason = "transcendante : import JS" },
