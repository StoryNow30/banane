# CH-111 — relais de la télécommande d'Ariane (Cloudflare Worker, offre gratuite). Fiche : telecommande/INSTALLATION.md.
# Aucun secret, aucune variable : le relais ne voit que du chiffré.
name = "ariane-telecommande"
main = "worker.js"
compatibility_date = "2026-10-01"

# La page du téléphone, et (CH-130) le rendu du panneau et sa feuille de style, importés comme texte par worker.js depuis le dépôt ou le paquet
# (../src/signal-rendu.js, ../src/telecommande-instantane.js, ../panel-signal.css) : déployer depuis ce dossier, à sa place dans le paquet.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/signal-rendu.js", "**/telecommande-instantane.js"]
fallthrough = false

# La police du panneau (Inter, SIL OFL), servie au téléphone.
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = false

# Un Durable Object par canal d'appairage. « new_sqlite_classes » : stockage SQLite, le seul ouvert à l'offre gratuite.
[[durable_objects.bindings]]
name = "CANAL"
class_name = "Canal"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Canal"]
