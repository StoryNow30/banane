# Relais de la télécommande : déploiement du Worker Cloudflare qui sert la page du téléphone
# (telecommande/INSTALLATION.md § G). Ce fichier ne contient aucun secret : le jeton Cloudflare est un secret de
# dépôt, `CLOUDFLARE_API_TOKEN`, posé une fois par l'opérateur dans Settings › Secrets and variables › Actions.
# L'adresse du relais porte le nom de l'opérateur (CH-130) : elle n'est jamais écrite dans le dépôt, un commit, le
# hub ou un journal de workflow — elle est masquée dans la sortie ci-dessous.
name: Relais

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Tape « deploy » pour confirmer le déploiement du relais'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: relais
  cancel-in-progress: false

jobs:
  deployer:
    if: github.event.inputs.confirmation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telecommande
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Un jeton copié depuis le tableau de bord arrive souvent avec un espace ou un retour à la ligne collé avec :
      # wrangler le refuse alors par « Headers.set: "***" is an invalid header value » (mesuré le 19/11). On le nettoie
      # ici une fois pour toutes, sans jamais l'afficher, et on refuse tôt un contenu qui n'est pas un jeton.
      - name: Le secret est-il posé, et propre ?
        env:
          BRUT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          JETON="$(printf '%s' "$BRUT" | tr -d '[:space:]')"
          if [ -z "$JETON" ]; then
            echo "Le secret CLOUDFLARE_API_TOKEN n'est pas posé sur ce dépôt."
            echo "Settings › Secrets and variables › Actions › New repository secret, nom exact CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if printf '%s' "$JETON" | grep -q '[^A-Za-z0-9_-]'; then
            echo "Le secret contient un caractère qui n'appartient pas à un jeton Cloudflare."
            echo "Diagnostic, sans jamais afficher le contenu :"
            echo "  longueur après nettoyage : ${#JETON} (un jeton Cloudflare en fait 40)"
            echo "  lettres $(printf '%s' "$JETON" | tr -cd 'A-Za-z' | wc -c), chiffres $(printf '%s' "$JETON" | tr -cd '0-9' | wc -c), tirets $(printf '%s' "$JETON" | tr -cd '-' | wc -c), soulignés $(printf '%s' "$JETON" | tr -cd '_' | wc -c)"
            echo "  octets étrangers (valeurs décimales) : $(printf '%s' "$JETON" | tr -d 'A-Za-z0-9_-' | od -An -tu1 | tr '\n' ' ')"
            echo "Réenregistre-le : Settings › Secrets and variables › Actions › CLOUDFLARE_API_TOKEN › Update."
            exit 1
          fi
          echo "::add-mask::$JETON"
          echo "CLOUDFLARE_API_TOKEN=$JETON" >> "$GITHUB_ENV"
          echo "Secret présent et nettoyé (valeur jamais affichée) : ${#JETON} caractères."
      - name: Déployer le relais
        env:
          CI: 'true'
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | sed -E 's#https?://[A-Za-z0-9._-]*workers\.dev#adresse du relais (masquée)#g'
      - name: Rappeler le contrôle
        run: |
          echo "Déploiement terminé. Contrôle sur l'iPhone : les quatre onglets Orbite · Écho · Constellation · Aurore,"
          echo "et menu ··· › « Page du relais : schéma 2 ». Dans le panneau, la feuille « Télécommande » ne dit plus"
          echo "« ancienne page ». Le nom du Worker, l'appairage et la clé ne changent pas : le téléphone n'a rien à refaire."
