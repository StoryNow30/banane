<!-- Fichier assemblé par sources/construire.cjs depuis sources/index.modele.tpl. -->
<style>
/* Page de comparaison volontairement neutre : elle ne doit pas peser sur les maquettes. */
:root{--fond:#F2F2F0;--carte:#FFFFFF;--texte:#161616;--texte-2:#555;--bord:#D6D6D2;--plein:#161616;--sur-plein:#FFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fond:#121212;--carte:#1B1B1B;--texte:#EDEDED;--texte-2:#A8A8A8;--bord:#2E2E2E;--plein:#EDEDED;--sur-plein:#121212}}
:root[data-theme="dark"]{--fond:#121212;--carte:#1B1B1B;--texte:#EDEDED;--texte-2:#A8A8A8;--bord:#2E2E2E;--plein:#EDEDED;--sur-plein:#121212}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;z-index:3;background:var(--fond);border-bottom:1px solid var(--bord);padding:12px 16px}
header h1{font-size:18px;margin:0 0 6px}
header p{margin:0 0 8px;color:var(--texte-2);max-width:70em}
.regles{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.regles label{display:flex;gap:6px;align-items:center;font-size:14px}
select{font:inherit;color:var(--texte);background:var(--carte);border:1px solid var(--bord);border-radius:6px;padding:4px 6px}
.familles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.familles button{font:inherit;font-size:13px;border:1px solid var(--bord);background:var(--carte);color:var(--texte);border-radius:999px;padding:4px 10px;cursor:pointer}
.familles button[aria-pressed="true"]{background:var(--plein);color:var(--sur-plein);border-color:var(--plein)}
main{padding:8px 16px 40px}
section h2{font-size:17px;margin:24px 0 2px}
section>p{margin:0 0 10px;color:var(--texte-2)}
.rangee{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.carte{flex:none;background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:10px;width:calc(var(--w) + 22px)}
.carte h3{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}
.carte h3 a{color:var(--texte)}
.carte .src{font-size:12px;color:var(--texte-2);margin:0 0 8px;min-height:3em}
.carte iframe{display:block;width:var(--w);height:760px;border:0;border-radius:6px;background:var(--fond)}
.carte details{font-size:13px;margin-top:8px}
.carte details p{margin:6px 0 0}
</style>

<body>
<header>
  <h1>Ariane, panneau : propositions neuves (CH-014)</h1>
  <p id="resume"></p>
  <div class="regles">
    <label>Scène <select id="scene"></select></label>
    <label>Thème <select id="theme"><option value="auto">système</option><option value="light">clair</option><option value="dark">sombre</option></select></label>

    <label>Mouvement <select id="mouvement"><option value="systeme">système</option><option value="reduit">réduit</option></select></label>
  </div>
  <div class="familles" id="familles" role="group" aria-label="Familles affichées"></div>
</header>
<main id="liste"></main>
<script>
(function () {
  'use strict';
  const D = {"familles":[{"prefixe":"","titre":"Feuille blanche","desc":"Quatre propositions de l’intégrateur, chacune tirée de deux ou trois références nommées."},{"prefixe":"instr-","titre":"Instruments et matière","desc":"Le panneau est un objet qu’on manipule et qu’on lit comme un instrument."},{"prefixe":"mouv-","titre":"Le mouvement porte l’état","desc":"Ce qui bouge, et comment, dit l’état ; le texte confirme."},{"prefixe":"app-","titre":"Motifs d’application","desc":"Des parcours et motifs d’apps éprouvés, choisis pour un opérateur qui surveille de loin."},{"prefixe":"edito-","titre":"Éditorial et typographie","desc":"La typographie, la mise en page et le récit portent l’état."},{"prefixe":"matiere-","titre":"Lumière, atmosphère, 3D","desc":"La lumière, la matière et l’image du relevé lui-même."},{"prefixe":"info-","titre":"Signalétique et information","desc":"Un système d’information compris d’un coup d’œil, sans couleur."}],"maquettes":[{"nom":"app-feuille","titre":"Feuille à crans","famille":"Motifs d’application","source":"Glossaire de mobbin, fiche « Bottom Sheet » : crans (« snap points »), feuille non modale qui laisse agir derrière, pas pour une tâche principale ; exemples de feuilles de livraison à crans. beUI : composant « Bottom Sheet » (points d'arrêt 0,5 et 0,92, seuil de renvoi 120 px) et son guide de mouvement (ouvrir 200–500 ms, l'ancien contenu part plus vite que le nouveau n'arrive). 60fps : « Recollect Pro bottom sheet to page » (la même surface grandit). SwiftPieces : ScrollIsland (« which part am I in, how much is left »), le block Agent Run (état, horloge, activité, Pause, Stop confirmé, bilan), StepTrail pour la file, rôle « value » (un chiffre ne dépasse jamais). navbar.gallery, type « Announcement » : les incidents en bande mince tout en haut.","sens":"Bleu pétrole : l'action à faire et le progrès d'Ariane. Ambre : ce qui attend un regard (différés, à examiner, ESV à relier). Brique : arrêt. Vert : fait. Chaque couleur a son mot et sa forme : rond plein = en cours, deux barres = pause, carré = arrêté, coche = fini, œil = Écho. Barre pleine = total connu ; barre hachurée qui glisse = total inconnu, jamais deviné. La feuille glisse à la main (poignée) ou par ses trois boutons ; l'état choisit le cran utile (en cours : Résumé, pour lire de loin). Le grand chiffre monte d'un cran à chaque cut, sans rebond. « Arrêter » s'élargit en « Confirmer l'arrêt » avec un trait qui se vide en 4 s."},{"nom":"app-ilot","titre":"Îlot et fil","famille":"Motifs d’application","source":"SwiftPieces : ScrollIsland (« which part am I in, how much is left, and a way to jump », un îlot flottant qui grandit en panneau, l'anneau qui dit combien est fait) ; FollowScroll (un fil qui suit le plus récent) ; StatusTimeline (le détail qui sort de son nœud, comme ici l'examen d'un cut) ; le pattern « Activity Timeline » (« Runs of one kind fold into one line ») pour les suites de cuts posés. beUI : le bloc « Dynamic Island » (pilule qui s'élargit en « TIMER 2:34 », petit libellé en capitales au-dessus d'un chiffre) et son guide (« move the shape first, then introduce its label »). mobbin : « Status Dot » (un point d'état n'est jamais seul, un mot l'accompagne) et « Toast ».","sens":"Le noir est la voix d'Ariane, au même endroit dans les deux thèmes ; le blanc dans l'îlot est l'action à faire. L'anneau dit la part faite quand le total est connu ; trois points qui passent disent « ça tourne, total inconnu ». Dans le fil : rond plein = maintenant ; ambre avec deux barres = différé ; vert avec un œil = posé mais à examiner ; coche = partie faite ; triangle brique = arrêt. L'îlot se referme en encore-cours (on lit de loin) et s'ouvre de lui-même en pause, à l'arrêt, à la fin, sur un incident."},{"nom":"app-onglets","titre":"Onglets et accessoire","famille":"Motifs d’application","source":"SwiftPieces : le block « Accessory Tab Bar » (« A compact accessory above the tab bar shows what is live ») et sa vignette ; le block « Agent Run » (puce d'état, horloge, activité en cours, barre à segments, deux cellules de compte, Pause et Stop) ; la pièce StatusTimeline pour la frise des parties ; TrackingTabs (compteur après le titre d'onglet) ; NowPlaying (le mini-lecteur qui devient la page). mobbin, glossaire « Tab Bar » (libellés, pas plus de cinq onglets) et « Segmented Control » pour Orbite / Écho. v0, gabarit Tasko (compteur « 124 » à côté de l'onglet). beUI, guide de mouvement (« let the old content leave faster than the new content arrives »).","sens":"L'accessoire est inversé (clair sur encre en thème clair, encre sur clair en sombre) : il parle du lot, pas de l'onglet ouvert ; il devient brique avec le mot « arrêtée » si la file s'arrête. Indigo : l'action. Ambre et le compteur d'onglet : ce qui attend un regard. Vert : partie faite (coche). Barre à segments : un segment par dixième du lot, le segment en cours en indigo ; total inconnu : trame sans quantité. Mouvement : l'onglet choisi glisse, le nouveau contenu arrive du côté de l'onglet (220 ms), le compteur roule, l'examen d'un cut s'empile depuis la droite, l'accessoire se secoue une fois à l'arrêt d'une file."},{"nom":"bassin","titre":"Bassin","famille":"Feuille blanche","source":"KoiPond : une surface d'eau vivante sur laquelle des nénuphars dérivent et des carpes glissent ; on touche, l'eau répond ; un bassin qui devient piscine. inspora : les bleus d'eau et l'aquarelle. 60fps : chaque geste reçoit une réponse.","sens":"Chaque cut posé fait une onde. Un différé laisse un nénuphar vert qui reste à la surface. Un vert à examiner est une carpe orange qui tourne en attendant qu'on la regarde. On touche un nénuphar ou une carpe pour l'examiner. Eau immobile : rien ne tourne. En Écho, le bassin devient piscine : Ariane regarde l'opérateur nager. En mouvement réduit, l'eau est figée ; nénuphars et carpes restent là où ils sont."},{"nom":"edito-manchette","titre":"Ariane, proposition « La Une »","famille":"Éditorial et typographie","source":"landdding, la fiche du site Fieldwork : manchette serif pleine largeur et rubriques en capitales posées sur un filet épais. fontshare, fiche « Details » d'Erode (serif pensée pour titres et citations éditoriaux) et de Supreme (sans construite, sobre). iter0, le « Launch brief » (libellé gris au-dessus, valeur forte) pour le bilan. wedoflow, gabarit Boldest : le nombre géant suivi de son unité en petit. emilkowal.ski, « You Don't Need Animations » : transitions sous 300 ms, en ease-out.","sens":"Encre sur papier pour tout ce qui va bien. Le trait épais sous la manchette est la progression : la part en encre est faite, le reste est en filet clair ; en pointillé quand le total est inconnu. Un seul rouge, l'« édition spéciale » : il paraît seulement quand une décision vous attend (ESV absent, onglet à choisir, file arrêtée, confirmation d'arrêt), toujours avec le mot « À vous »."},{"nom":"edito-rature","titre":"Ariane, proposition « La liste rayée »","famille":"Éditorial et typographie","source":"iter0, accueil, étape « Sharpen » : le trait de crayon qui raye une ligne réglée et la note manuscrite en italique qui en donne la raison ; le dialogue où les messages anciens s'estompent vers le haut. beui, « Agent Activity / Streaming Text » : le flux monte d'un seul mouvement au lieu de sauter. fontshare, fiche « Details » de Sentient. microcopy : des phrases complètes qui disent quoi faire.","sens":"Rayé au crayon graphite = traité (posé ou différé). En gras avec le curseur = ce qu'Ariane fait maintenant. Gris clair = pas encore fait. Note bleue en marge, précédée d'une flèche = à regarder par vous (différé, vert à examiner, incident). Le réglage est une phrase à trous : on lit ce qu'on lance."},{"nom":"edito-specimen","titre":"Ariane, proposition « Le spécimen »","famille":"Éditorial et typographie","source":"fontshare : la liste des familles (méta 10 px puis nom à 120 px, filets, aucun rayon), l'onglet actif en bloc noir avec son effectif (« Fonts 100 »), la grille « Glyphs » (une case par glyphe), le compteur qui change en tête quand on filtre (100 → 55 → 17) ; fiche « Details » de Tabular (même chasse pour tous les glyphes). Exemplar, vu sur landdding : le nom de la graisse en petit à gauche d'une ligne géante. beui, « Digit Swap » : chiffres dans des cases fixes.","sens":"Aucune couleur. Bloc plein = actif (l'activité en cours) ou à vous (ESV absent, cause d'arrêt, action principale). La grille : une case par tranche de 10 cuts ; pleine = faite, cadre épais = en cours, grisée = à venir ; un chiffre dans la case = nombre de cuts à regarder dans cette tranche. Hachures = action indisponible, avec sa raison écrite dessous."},{"nom":"faisceau","titre":"Faisceau","famille":"Feuille blanche","source":"libraries.dev, Border beam : une lueur qui court sur la bordure d'une carte. SwiftPieces : le verre et les cartes posées sur un fond. backgrounds.supply : un fond profond qui respire et une barre de navigation en verre. beUI : la frise qu'on fait glisser (Timeline) et l'alerte qui se déplie (Animated Alert).","sens":"Le faisceau fait le tour de la carte du lot tant qu'Ariane pose : de loin, on voit que ça vit. En pause, il s'arrête net sur place ; à l'arrêt ou à la fin, il disparaît. La frise aligne les cuts remarquables : on la fait glisser, on touche un jalon pour l'examiner. Le vert d'eau avec un losange veut dire « vert à examiner », et rien d'autre."},{"nom":"info-allure","titre":"Allure du lot","famille":"Signalétique et information","source":"","sens":"Logique. Le panneau répond d'abord à « le lot ralentit-il ? » : une phrase avec flèche et signe, la courbe de cadence avec sa médiane, et un axe du temps qui place début, maintenant et fin estimée."},{"nom":"info-constantes","titre":"Constantes","famille":"Signalétique et information","source":"","sens":"Logique. Le lot se lit comme un moniteur de constantes : une colonne de cinq chiffres alignés, lisibles de loin, chacun avec une case de score."},{"nom":"info-gravite","titre":"Gravité unique","famille":"Signalétique et information","source":"","sens":"Logique. Une seule échelle à trois niveaux, « rien à signaler », « à regarder », « à agir », organise tout le panneau : chaque ligne porte son niveau, et le bandeau du haut prend le plus haut."},{"nom":"info-minuteur","titre":"Minuteur à secteur","famille":"Signalétique et information","source":"","sens":"Logique. Le temps qui reste se lit comme sur un minuteur à secteur : un cadran de 60 minutes dont le secteur plein vaut les minutes restantes et rétrécit vers midi."},{"nom":"info-pictos","titre":"Pictogrammes du lot","famille":"Signalétique et information","source":"","sens":"Logique. Un jeu de pictogrammes dessinés pour ce métier, qui tient en noir et blanc ; les quantités se comptent en signes identiques répétés."},{"nom":"instr-cadran","titre":"Cadran","famille":"Instruments et matière","source":"Scrubbers (dépôt haplollc) : la face ThermostatFace.swift (300° de graduations, 90 traits, celles jusqu'à la valeur allumées, un long trait pour la valeur, une face qui ne change de teinte que hors du tiers calme et part du centre), la correspondance angulaire de Scrubber.swift (l'angle déroulé tour après tour) et les crans de ScrubberScale.swift ; la face RulerFace.swift pour la lecture en gras. libraries.dev, paquet bot-avatars (engine.ts) : les changements d'état sont des mélanges doux, plus lents vers le repos que vers le travail.","sens":""},{"nom":"instr-gelee","titre":"Gelée","famille":"Instruments et matière","source":"Scrubbers (dépôt haplollc) : JellyFace.swift (bande de gelée épinglée à gauche, longueur = valeur, chaîne de Verlet, longueur naturelle qui rattrape la poignée, gelée amincie quand on tire, à plat au repos, lumière intérieure et reflet net) et FluidFace.swift (col gluant par flou puis seuil alpha). libraries.dev, paquet liquid-gooey (filter.tsx, spring.ts ; démo Gooey jouée : le menu « + » qui se scinde en gouttes, le curseur Move et sa traîne) : la silhouette gluante est dessous, le texte reste net dessus.","sens":""},{"nom":"instr-metal","titre":"Pupitre","famille":"Instruments et matière","source":"libraries.dev : paquet border-beam (styles.ts : un cône de lumière qui tourne, masqué pour ne garder que le bord ; deux familles, rotation et respiration ; pulseDriver.ts : respiration lente) et paquet metal-fx (README, cursor/light.ts : un anneau de matière autour d'un seul élément, rien en mouvement réduit) ; page Metal jouée au survol. Scrubbers (dépôt haplollc) : TapeFace.swift pour la lecture qui roule chiffre par chiffre, ScrubberScale.swift pour la molette à crans.","sens":""},{"nom":"instr-orbe","titre":"Orbe","famille":"Instruments et matière","source":"ThinkingOrbs (dépôt haplollc) : OrbEngine.swift (projecteur rotation + inclinaison, tri du loin au proche, rayon et encre selon la profondeur ; designs orbits, braid, ring, morph cercle → triangle → carré), ThinkingOrb.swift (image fixe en mouvement réduit, horloge partagée), ThinkingOrbLabel.swift (bande de lumière qui traverse le texte). libraries.dev : paquet bot-avatars (engine.ts : mélange des poids d'état, 0,7 s vers le travail, 1,2 à 1,4 s vers le repos) ; page Thinking orbs consultée.","sens":""},{"nom":"instr-ruban","titre":"Ruban","famille":"Instruments et matière","source":"Scrubbers (dépôt haplollc) : TapeFace.swift (on tire l'échelle, pas un bouton ; grands traits espacés d'au moins 54 px ; bords en fondu ; lecture en gros qui roule ; aiguille qui grandit quand on tient), la relâche « qui coule » de Scrubber.swift et ScrubberMotion.swift (vitesse × 0,32 s puis ressort sur le cran), et SquiggleFace.swift (onde qui roule tant que la lecture joue, couchée à plat à l'arrêt).","sens":""},{"nom":"matiere-horizon","titre":"Ariane — Horizon","famille":"Lumière, atmosphère, 3D","source":"heydamir.design : le concept « Step out of the feed » et sa ligne « keeps its own hours : Day · Dusk · Night · Dawn » avec un petit cadran ; l’accueil, qui dit son état par l’heure (« Asleep, I’ll reply in the morning »). backgrounds.supply : la collection Horizon (une ligne de lumière basse) et le mode Edge Glow du Gradient Lab, dont un seul réglage, la hauteur, fait toute l’ambiance. inspora.design (vu en grille) : deux cadrans superposés, deux heures, deux matières ; un tableau de bord posé sur un crépuscule avec l’heure en grand.","sens":"Le soleil va du lever (premier cut) au coucher (dernier cut) ; la course faite est tracée en plein, la course restante en pointillé. Ciel clair = Ariane pose seule, rien à faire. Voile immobile = pause (le temps est suspendu). Ciel couvert et gris = lot arrêté. Brouillard = ESV non relié ou onglet à choisir : on ne voit plus l’horizon. Nuit étoilée = lot terminé : chaque étoile est un cut à revoir (croix = différé, point = vert à examiner), leur nombre est écrit. Nuit avec une lueur qui court sur l’horizon = relecture entre deux parties. Écho = nuit d’observation : chaque pose vue de l’opérateur s’allume."},{"nom":"matiere-spectre","titre":"Ariane — Spectre","famille":"Lumière, atmosphère, 3D","source":"heydamir.design, concept « One light, every color » : un rayon blanc entre dans un bloc de verre et en sort en spectre ; « Split the light » éteint et rallume la source ; au survol, une lecture de longueur d’onde ; légendes numérotées « 01 · Source », « 03 · Spectrum ». backgrounds.supply, Gradient Lab, mode Prism : trois réglages seulement (position, largeur, intensité) — ici la largeur est la part traitée. inspora.design (vu en grille) : des cartes dont la lumière intérieure est l’avancement, le pourcentage écrit à côté. La physique : les raies d’absorption (une lumière à laquelle il manque quelque chose).","sens":"Source allumée = Ariane pose ; source coupée (un volet sur la fente) = pause ou arrêt ; pas de fente = ESV non relié. Position dans le spectre = position du cut entre la première et la dernière borne (violet = début, rouge = fin, nombres écrits aux deux bouts). Raie sombre pleine hauteur = différé ; encoche en haut = vert à examiner. Spectre pâli = lot à l’arrêt, rien n’est perdu. Lumière qui entre par la droite = Écho : Ariane reçoit au lieu d’émettre. Trait qui revient de droite à gauche = relecture."},{"nom":"mosaique","titre":"Mosaïque","famille":"Feuille blanche","source":"libraries.dev Image : un chargeur où une mosaïque de gros pixels se résout en image nette. inspora : les images en trame et les filtres en pavés gris. backgrounds.supply : les trames ASCII. 60fps : le compteur qui s'anime.","sens":"Le lot est une image : une tuile par cut, dans l'ordre. Une tuile floue n'est pas encore faite. Quand Ariane pose le cut, la tuile se résout et devient nette. Un différé reste en gros pixels, entouré d'un cadre. Un vert à examiner a un coin corail et un losange. L'image est abstraite (deux ondes qui se croisent) : elle ne représente rien du relevé, elle sert à voir le lot se former. On touche une tuile pour la lire, et on touche une tuile marquée pour l'examiner. De loin, on voit l'image se remplir."},{"nom":"mouv-compteur","titre":"Ariane · Le compteur","famille":"Le mouvement porte l’état","source":"60fps.design : Number Flip with Reflection (le chiffre neuf glisse, les autres ne bougent pas), Circle Wallet Claim Balance et Revolut Number of Transactions (compteur qui roule puis se pose), Tactile Button (le bouton qui s’enfonce sur sa tranche, repris pour toutes les actions). beui.dev, Number Animation (code lu) : chaque chiffre est une colonne 0–9 repérée par son rang depuis la droite, si bien qu’un chiffre qui change roule au lieu de réapparaître ; le décalage entre chiffres n’est joué qu’une fois. Guide de beui.dev : « linear for progress », ressort court pour un objet qui se pose.","sens":"Le cran qui tombe toutes les secondes sur le tambour des unités : le lot tourne. Plus rien ne bouge et un cliquet est posé contre les tambours, avec le mot « en pause » : la prochaine avance attend. Une barre rouge marquée « arrêté » en travers : le lot s’est arrêté. Seul le tambour du cut oscille, sans avancer, avec le mot « à vous » : Ariane a besoin de l’opérateur. Le tambour du cut tourne sans fin, lentement : relecture d’une partie, rien n’est posé. Un cadre en pointillé « total inconnu » : le total n’est pas deviné. Aucune couleur ne porte seule un sens : l’ocre accompagne « à vous », le rouge « arrêté ». En mouvement réduit, les tambours se posent sans rouler ; le cliquet, la barre et les mots restent."},{"nom":"mouv-donne","titre":"Ariane · La donne","famille":"Le mouvement porte l’état","source":"beui.dev, bloc Card Dealer (code lu) : chaque carte reste la même d’une zone à l’autre et vole en arc en se retournant ; une carte qui change de place dans la main ne fait que sauter. 60fps.design : CRED Autopay Bills Stack (la pile qui se déplie en liste, reprise pour « Ce qui reste »), Microsoft Teams Catch-up (la pile qui se vide jusqu’à l’état final), Cancel Button Expand to Confirm (le bouton d’arrêt qui s’étire au second appui). Guide de mouvement de beui.dev : entrée en sortie rapide, moins de 300 ms pour l’interface, mouvement réduit = l’état final composé.","sens":"Une carte qui vole de la pioche à la pile toutes les secondes : le lot tourne. Une carte suspendue au-dessus de la pioche, immobile : en pause, la prochaine attend. Une bande rouge en travers de la pioche, avec le mot « arrêté » : le lot s’est arrêté. Une carte au centre, tendue vers l’opérateur, qui se balance lentement : Ariane a besoin de lui. Pioche vide en pointillé : le lot est fini. La pile qui se feuillette : relecture d’une partie. Cartes face cachée dans la main : différés (pas posés) ; cartes face visible cochées : posées, à examiner. En Écho, la pioche disparaît et les cartes arrivent du bord de l’opérateur. Couleurs : encre et papier ; l’ocre ne sert qu’à « à vous », le rouge qu’à l’arrêt. En mouvement réduit, chaque position reste (carte levée, bande, carte tendue), sans vol."},{"nom":"mouv-fil","titre":"Ariane · Le fil","famille":"Le mouvement porte l’état","source":"beui.dev : Streaming Response (code lu : le texte avance par un curseur à vitesse fixe, complet d’emblée en mouvement réduit), Agent Activity (un seul journal pour les étapes et les appels d’outil), Todo List (statut par forme : plein, vide, entamé). motionin.design : Benchmark (une lentille de focus : seule la ligne au centre est grande et sombre, la taille décroît avec la distance, sans flou, pas à pas en « expo in-out ») et Pixels (une ligne pleine largeur coupe le contenu entre l’ancien et le nouvel état). 60fps.design : List Fade Up from Down (la liste entre par le bas). Guide de beui.dev : « linear for progress ».","sens":"Des lignes qui s’écrivent l’une après l’autre : le lot tourne. Un curseur seul qui clignote sur une ligne vide « reprend au cut… » : en pause, rien ne s’écrit. Un trait rouge qui traverse le fil, puis la cause écrite dessous : le lot s’est arrêté. La question d’Ariane en grand, en ocre, avec un curseur rapide : Ariane attend l’opérateur. Les lignes qui se resserrent sous une ligne de bilan : fin du lot. Carré plein : posé ; carré vide : différé ; carré à moitié plein : posé, à examiner. La barre de progression avance à vitesse constante ; en pointillé, elle dit « total inconnu ». En mouvement réduit, les lignes paraissent entières, le curseur ne clignote pas, le trait d’arrêt est déjà tracé."},{"nom":"vivant","titre":"Signal vivant","famille":"Feuille blanche","source":"heydamir : fond anthracite chaud, appareils à double cadre arrondi, bouton crème qui rayonne, le mot qui compte en dégradé pêche. ThinkingOrbs et libraries.dev : l'orbe en points dans une pastille, avec un libellé qui scintille tant que l'agent travaille.","sens":"La lumière chaude signifie « Ariane agit » : elle est sur le mot d'état quand le lot tourne, et sur le seul bouton qui fait avancer. Si rien ne brille, rien ne tourne. L'orbe change de forme selon ce que fait Ariane. Chaque point de la frise est un cut : plein, posé ; creux, différé ; losange bleu froid, vert à examiner."}]};
  const SCENES = [['pret', 'Prêt'], ['encours', 'En cours'], ['encours-inconnu', 'En cours, total inconnu'], ['pause', 'En pause'], ['arrete', 'Arrêté au milieu'], ['fin', 'Fin de lot'], ['reste', 'Ce qui reste'], ['examen', 'Examiner un cut'], ['pret-absent', 'ESV non connecté'], ['pret-onglet', 'Onglet à choisir'], ['reprise', 'Reprise après rechargement'], ['pret-file', 'File : réglage'], ['file-encours', 'File : partie 2 sur 3'], ['file-relecture', 'File : relecture'], ['file-alerte-page', 'File : alerte page figée'], ['file-alerte-onglet', 'File : alerte onglet fermé'], ['file-alerte-muet', 'File : alerte ESV muet'], ['file-alerte-refus', 'File : alerte refus'], ['file-fin', 'File : fin'], ['echo', 'Écho']];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sel = document.getElementById('scene');
  sel.innerHTML = SCENES.map(([v, t]) => `<option value="${v}"${v === 'encours' ? ' selected' : ''}>${t}</option>`).join('');
  const r = () => ({ scene: sel.value, theme: document.getElementById('theme').value, largeur: document.getElementById('largeur').value, mouvement: document.getElementById('mouvement').value });
  document.getElementById('resume').textContent = `${D.maquettes.length} propositions jouables, en ${D.familles.filter((f) => D.maquettes.some((m) => m.famille === f.titre)).length} familles de conception. Les réglages ci-dessous s'appliquent à toutes ; chaque titre ouvre la maquette seule, avec sa régie et ses notes.`;
  const actives = new Set(D.familles.map((f) => f.titre));
  const fam = document.getElementById('familles');
  function boutonsFamilles() {
    fam.innerHTML = D.familles.filter((f) => D.maquettes.some((m) => m.famille === f.titre)).map((f) => `<button aria-pressed="${actives.has(f.titre)}" data-f="${esc(f.titre)}">${esc(f.titre)} (${D.maquettes.filter((m) => m.famille === f.titre).length})</button>`).join('');
  }
  fam.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const f = b.dataset.f; actives.has(f) ? actives.delete(f) : actives.add(f); boutonsFamilles(); dessiner(); });
  function src(m) { const x = r(); return `${m.nom}.html?regie=0&seul=1&s=${x.scene}&t=${x.theme}&w=${x.largeur}&m=${x.mouvement}`; }
  function dessiner() {
    const x = r();
    document.documentElement.style.setProperty('--w', x.largeur + 'px');
    if (x.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', x.theme);
    document.getElementById('liste').innerHTML = D.familles.filter((f) => actives.has(f.titre)).map((f) => {
      const ms = D.maquettes.filter((m) => m.famille === f.titre);
      if (!ms.length) return '';
      return `<section><h2>${esc(f.titre)}</h2><p>${esc(f.desc)}</p><div class="rangee">${ms.map((m) => `<article class="carte"><h3><a href="${m.nom}.html">${esc(m.titre)}</a></h3><p class="src">${esc(m.source.slice(0, 180))}${m.source.length > 180 ? '…' : ''}</p><iframe loading="lazy" title="${esc(m.titre)}" src="${src(m)}"></iframe><details><summary>Ce que ça veut dire</summary><p>${esc(m.sens)}</p></details></article>`).join('')}</div></section>`;
    }).join('');
  }
  function appliquer() { document.querySelectorAll('iframe').forEach((f) => { try { f.contentWindow.postMessage({ ui2: r() }, '*'); } catch (e) { /* cadre pas encore chargé */ } }); const x = r(); document.documentElement.style.setProperty('--w', x.largeur + 'px'); if (x.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', x.theme); }
  ['scene', 'theme', 'largeur', 'mouvement'].forEach((id) => document.getElementById(id).addEventListener('change', appliquer));
  document.addEventListener('load', (e) => { if (e.target.tagName === 'IFRAME') e.target.contentWindow.postMessage({ ui2: r() }, '*'); }, true);
  boutonsFamilles(); dessiner();
})();
</script>
