/* Le niveau poussé change la matière, pas les commandes ni leur emplacement. */
:root[data-niveau="b3"]{--r-ctl:12px;--r-boite:20px;--cadre-espacement:32px;--marge:32px;--marge-v:24px;--t-chiffre:64px;--l-chiffre:68px;--t-etat:32px;--l-etat:40px}
:root[data-niveau="b3"][data-theme="sombre"]{--fond:#151310;--surface:#201D19;--surface2:#2F2A23;--encre:#F4EEE4;--encre2:#C1B5A4;--encre3:#B3A794;--filet:#453D32;--filet-fort:#796D5A;--progression:#E7BE86;--action:#EEE4D3;--action-tx:#252018;--action-survol:#FFF8EA}
:root[data-niveau="b3"][data-theme="clair"]{--fond:#F1ECE3;--surface:#FCF9F3;--surface2:#E9E0D3;--encre:#2B251E;--encre2:#625547;--encre3:#6D5C46;--filet:#DED3C4;--filet-fort:#A99A86;--progression:#7B4A17;--action:#352B20;--action-tx:#FFF9F0;--action-survol:#21190F}
:root[data-niveau="b3"] .instrument{margin:16px;padding:24px;gap:24px;background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-boite);box-shadow:inset 0 1px 0 var(--reflet),0 8px 24px -16px rgba(0,0,0,.2)}
:root[data-niveau="b3"] .etat .mot,:root[data-niveau="b3"] .compte .chiffre{font-family:"Bricolage Grotesque",var(--sans);font-weight:500;letter-spacing:-.035em}
:root[data-niveau="b3"] .compte .droite{flex-basis:100%;margin-left:0}.fen[data-etat="cours"] .rail-cur{will-change:left}
:root[data-niveau="b3"] .rail-fait{background:var(--progression);height:2px;top:19px}:root[data-niveau="b3"] .rail-cur{height:18px;top:10px}:root[data-niveau="b3"] .rail-cur:after{width:6px;height:6px;border-radius:50%;left:-2px;top:-4px;background:var(--progression)}
:root[data-niveau="b3"] .rail[data-etat="pause"] .rail-cur:after,:root[data-niveau="b3"] .rail[data-etat="relecture"] .rail-cur:after{background:var(--encre2)}

:root[data-niveau="b3"][data-taille="compact"] .instrument{margin:8px;padding:16px;gap:12px}:root[data-niveau="b3"][data-taille="compact"] .bascule{border:0;background:none}
/* r2 : les commandes conservent leur place, le contenu seul peut défiler. */
.instrument{overflow:hidden}.contenu-instrument{display:flex;flex-direction:column;gap:24px;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}.instrument>.actions,.instrument>.verrou-ligne{flex:none}
:root[data-taille="compact"] .contenu-instrument{gap:12px}
:root[data-taille="compact"] .tiroir[data-ouvert="1"]{top:calc(-1 * (var(--instrument-h,0px) + var(--cadre-espacement)))}
.temps-cut{font-size:13px;color:var(--encre2);white-space:nowrap}.temps-cut:before{content:" · ";padding:0 4px}
.file-suivi{font-size:13px;line-height:20px;color:var(--encre2)}.file-detail{margin-top:8px}.file-detail summary{cursor:pointer;min-height:32px;padding:4px 0;font-weight:500;color:var(--encre)}.file-detail p{margin-top:8px}.file-etapes li:not(.fait):not([aria-current]){border-top-style:dashed}.file-etapes li[aria-current="step"]{border-top-width:3px;padding-top:7px}
/* Toute animation a un but : geste confirmé, zone ouverte ou position du cut.
 * Le repli système et le repli du banc sont identiques, sans déplacement résiduel. */
:root[data-reduit="1"] .fen *,:root[data-reduit="1"] .fen *:before,:root[data-reduit="1"] .fen *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){.fen *,.fen *:before,.fen *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:640px){.plateau{padding:16px;gap:24px}.banc{padding:16px}.notes{max-width:100%}}


/* CH-023 : Registre. Hanken Grotesk et Newsreader sont embarquées sous OFL 1.1.
 * Le titre change sur place. La progression représente les cuts traités,
 * jamais le temps restant estimé. Les captures restent hors dépôt. */
@font-face{font-family:"Hanken Grotesk";src:url(../../fonts/HankenGrotesk-latin-wght.woff2) format("woff2");font-weight:100 900;font-display:block}

 --t-etat:38px;--l-etat:44px;--t-chiffre:42px;--l-chiffre:48px;

 --filet:#C6C8BC;--filet-fort:#8C998C;--vivant:#36574C;--attention:#865216;--alerte:#9C3D32;
 --progression:#36574C;--action:#36574C;--action-tx:#FAF8F1;--action-survol:#28483D;
 --ombre:0 12px 32px #20292220;--voile:#20292240;
}
:root[data-niveau="registre"][data-theme="sombre"]{
 --fond:#17201B;--surface:#17201B;--surface2:#29382D;--encre:#F4F0E6;--encre2:#C1CBBE;--encre3:#B0BEB0;
 --filet:#405143;--filet-fort:#7E9483;--vivant:#BAD2B5;--attention:#EDC28A;--alerte:#F2AAA0;
 --progression:#B8CEAE;--action:#C2D4BB;--action-tx:#17201B;--action-survol:#DFE9DA;
 --ombre:0 12px 32px #0005;--voile:#10181070;

function memeNoeud(a, b) {

  if (a.nodeType !== 1) return true;
  const cle = e => e.id || e.getAttribute('data-k') || e.getAttribute('data-act') || e.getAttribute('data-row') || e.getAttribute('data-examine') || '';
  return cle(a) === cle(b);

function accorder(a, b) {
  if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }

  for (const n of a.getAttributeNames()) if (!b.hasAttribute(n) && !(n === 'open' && a.tagName === 'DETAILS')) a.removeAttribute(n);
  for (const n of b.getAttributeNames()) if (a.getAttribute(n) !== b.getAttribute(n)) a.setAttribute(n, b.getAttribute(n));
  const enfants = [...b.childNodes];
  enfants.forEach((n, i) => {
    let actuel = a.childNodes[i];
    if (!actuel) { a.append(n.cloneNode(true)); return; }
    if (!memeNoeud(actuel, n)) {
      const trouve = [...a.childNodes].slice(i + 1).find(x => memeNoeud(x, n));
      if (trouve) { a.insertBefore(trouve, actuel); actuel = trouve; }

}

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { S.pi = Math.max(0, Math.min(L.length - 1, S.pi + (e.key === 'ArrowDown' ? 1 : -1))); rendre(); e.preventDefault(); }
    else if (e.key === 'Enter') { const c = L[Math.max(0, Math.min(L.length - 1, S.pi))]; if (c && c.getAttribute('aria-disabled') !== 'true' && c.dataset.act) { S.couche = null; S.q = ''; S.pi = 0; agir(c.dataset.act); } e.preventDefault(); }
    return;
  }
  if (S.tiroir && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.target.closest('input,select')) {
    const n = FEN.querySelectorAll('#tiroir-corps [data-row]').length; if (!n) return;
    S.sel = Math.max(0, Math.min(n - 1, (S.sel ?? -1) + (e.key === 'ArrowDown' ? 1 : -1))); rendre(); FEN.querySelector(`[data-row="${S.sel}"]`)?.scrollIntoView({ block: 'nearest' }); e.preventDefault();
  }
  if (S.tiroir && R.dataset.revue === 'v2' && S.sel !== null && (e.key === 'e' || e.key === 'E') && !e.target.closest('input,select')) { const b = FEN.querySelector(`[data-row="${S.sel}"] [data-examine]`); if (b) b.click(); }
});

D.getElementById('notes').addEventListener('click', e => { const b = e.target.closest('[data-sim]'); if (!b || b.tagName !== 'BUTTON') return; const F = S.file;
  if (b.dataset.sim === 'finir' && F.en) { finirPartie(); rendre(); }
  if (b.dataset.sim === 'arret' && F.en) { F.en = false; appliquerCause(); S.scene = 'file-alerte'; S.tiroir = false; rendre(); } });
D.getElementById('notes').addEventListener('change', e => { if (e.target.dataset.sim !== 'cause') return; S.file.cause = e.target.value; if (S.scene === 'file-alerte') appliquerCause(); rendre(); });

/* ─────────────────────────── banc d'essai */
function regler(k, v) {
  if (k === 'placement') { S.placement = v; R.dataset.placement = v; if (S.scene === 'file-eteinte' || S.scene === 'file-reglage') { scene(S.scene); return; } }
  if (k === 'taille') R.dataset.taille = v; if (k === 'theme') R.dataset.theme = v; if (k === 'revue') R.dataset.revue = v; if (k === 'cadence') R.dataset.cadence = v;
  D.querySelectorAll(`.banc [data-${k}]`).forEach(b => b.setAttribute('aria-pressed', b.dataset[k] === v));
  rendre();
}
function scene(id) {
  S.archiveInterruption = false; S.relectureIndex = 58; S.relectureTemps = 0; S.arretDemande = null; S.echoPause = id === 'echo-pause'; S.file = FILE0(); const F = S.file;
  if (id === 'file-reglage') { if (S.placement === 'a') { id = 'file-reglage'; } }
  if (id === 'file-cours') { Object.assign(F, { allumee: true, n: 3, relecture: true, correction: true, en: true, partie: 2, bilans: [bilanInvente(1, { relecture: true, correction: true })] }); }
  if (id === 'file-alerte') { Object.assign(F, { allumee: true, n: 3, relecture: true, correction: true, bilans: [bilanInvente(1, { relecture: true, correction: true }), bilanInvente(2, { relecture: true, correction: true })] }); }
  if (id === 'file-fin') { Object.assign(F, { n: 2, relecture: true, correction: true, bilans: [bilanInvente(1, { relecture: true, correction: true }), bilanInvente(2, { relecture: true, correction: true })] }); }
  if (id === 'arrete') { sim.lot = lotDeBase(); sim.lot.etat = 'arrete'; }
  const idVue = id; if (id === 'file-cours') id = 'cours';
  S.scene = id; S.couche = idVue === 'file-reglage' && S.placement === 'a' ? 'file' : id === 'palette' ? 'palette' : id === 'reglages' ? 'reglages' : id === 'cache' ? 'cache' : id === 'esv' ? 'esv' : null; S.tiroir = false; S.sel = null; S.note = ''; S.exportFait = false;
  if (id === 'file-alerte') appliquerCause();
  if (id === 'cours' || id === 'palette') { sim.lot = lotDeBase(); sim.lot.etat = 'cours'; } else if (id === 'pause') { sim.lot = lotDeBase(); sim.lot.etat = 'pause'; sim.lot.pauseDepuis = 80; } else if (id === 'incident' || id === 'interrompu' || id === 'esv-muet') { sim.lot = lotDeBase(); sim.lot.etat = 'incident'; }
  if (id === 'echo') echoDeBase();
  D.getElementById('sc-scene').value = idVue; rendre();
}
const sel = D.getElementById('sc-scene'); sel.innerHTML = SCENES.map(([k, t]) => `<option value="${k}">${esc(t)}</option>`).join(''); sel.addEventListener('change', () => scene(sel.value));
D.querySelectorAll('.banc .seg button').forEach(b => b.addEventListener('click', () => { const k = Object.keys(b.dataset)[0]; regler(k, b.dataset[k]); }));
D.getElementById('sc-reduit').addEventListener('change', e => { if (e.target.checked) R.dataset.reduit = '1'; else delete R.dataset.reduit; });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if (S.reglages['Thème'] === 'Système') regler('theme', e.matches ? 'sombre' : 'clair'); });
const P = new URLSearchParams(location.search);
R.dataset.nu = P.get('nu') === '1' ? '1' : '0';
if (P.get('taille')) regler('taille', P.get('taille')); if (P.get('theme')) regler('theme', P.get('theme')); if (P.get('revue')) regler('revue', P.get('revue')); if (P.get('cadence')) regler('cadence', P.get('cadence'));
if (P.get('reduit') === '1') { R.dataset.reduit = '1'; D.getElementById('sc-reduit').checked = true; }
scene(SCENES.some(s => s[0] === P.get('scene')) ? P.get('scene') : 'cours');
if (P.get('tiroir') === '1') { S.tiroir = true; rendre(); }
if (P.get('fige') === '1') { /* captures : on fige l'avancement au premier dessin */ } else sim.tick = setInterval(boucle, 250);
window.ArianeMaquette = { S, sim, scene, rendre, finirPartie };
})();
