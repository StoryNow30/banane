<!doctype html>
<html lang="fr" data-theme="clair" data-taille="normal" data-revue="v1" data-cadence="reelle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R · Carnet technique</title>
<meta name="description" content="Maquette Ariane 5.0, direction « Carnet technique » : l'instrument et le tiroir, avec une allure vivante. Chiffres inventés.">
<style>
/* ───────────────────────────── polices locales (OFL, ../../fonts/) */
@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-latin-opsz-wght.woff2) format("woff2");font-weight:200 800;font-display:block}
@font-face{font-family:"Hanken Grotesk";src:url(../../fonts/HankenGrotesk-latin-wght.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url(../../fonts/JetBrainsMono-latin-wght.woff2) format("woff2");font-weight:100 800;font-display:block}
@font-face{font-family:"Instrument Serif";src:url(../../fonts/InstrumentSerif-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:block}

/* ───────────────────────────── jetons (§ 6 du document d'architecture, palette Carnet) */
:root{
  --sans:"Hanken Grotesk",system-ui,sans-serif; --titre:"Bricolage Grotesque","Hanken Grotesk",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --t-chiffre:44px; --l-chiffre:48px; --t-etat:28px; --l-etat:32px; --t-texte:15px; --l-texte:22px; --t-meta:13px; --l-meta:18px;
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px; --e7:48px;
  --r-ctl:3px; --r-boite:8px;
  --d-appui:120ms; --d-local:200ms; --d-glisse:300ms; --d-scene:400ms; --sortie:cubic-bezier(.2,.7,.2,1); --entree-sortie:cubic-bezier(.45,0,.2,1);
  --marge:var(--e7); --marge-v:var(--e6); --barre:48px; --poignee:40px; --cache:56px;
  --cellule:10px; --inter:3px;
}
:root[data-theme="clair"]{ /* papier gris chaud */
  --fond:#E9E6DF; --surface:#F0EEE8; --surface2:#F7F6F2; --encre:#16171A; --encre2:#57544E; --encre3:#827E76;
  --filet:rgba(22,23,26,.14); --filet-fort:rgba(22,23,26,.28);
  --vivant:#276D44; --attention:#815A0E; --alerte:#B2362A; --bleu:#1F4FD8; --bleu-tx:#1F4FD8;
  --action:#1F4FD8; --action-tx:#F0EEE8; --action-survol:#1A44BE;
  --ombre:0 1px 2px rgba(22,23,26,.08),0 0 0 1px var(--filet); --voile:rgba(22,23,26,.22); color-scheme:light;
}
:root[data-theme="sombre"]{ /* ardoise */
  --fond:#202327; --surface:#282C31; --surface2:#31363C; --encre:#ECE9E2; --encre2:#B3AFA6; --encre3:#7A766E;
  --filet:rgba(236,233,226,.14); --filet-fort:rgba(236,233,226,.28);
  --vivant:#63BB85; --attention:#E2B45C; --alerte:#F28C7E; --bleu:#2F55D6; --bleu-tx:#9DB4FF;
  --action:#2F55D6; --action-tx:#F4F2EC; --action-survol:#3A62E4;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 0 0 1px var(--filet); --voile:rgba(0,0,0,.4); color-scheme:dark;
}
:root[data-taille="compact"]{
  --t-chiffre:32px; --l-chiffre:36px; --t-etat:22px; --l-etat:28px; --t-texte:14px; --l-texte:20px; --t-meta:12px; --l-meta:16px;
  --marge:var(--e4); --marge-v:var(--e4); --barre:40px; --poignee:36px; --cache:40px; --cellule:8px; --inter:2px;
}
@media (prefers-reduced-motion:reduce){:root{--d-appui:0ms;--d-local:0ms;--d-glisse:0ms;--d-scene:0ms}}
:root[data-reduit="1"]{--d-appui:0ms;--d-local:0ms;--d-glisse:0ms;--d-scene:0ms}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 var(--t-texte)/var(--l-texte) var(--sans);font-feature-settings:"tnum" 1;background:#D8D4CB;color:#2A2924;-webkit-font-smoothing:antialiased}
:root[data-theme="sombre"] body{background:#17191C;color:#CFCBC3}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;border-radius:var(--r-ctl)}
button:disabled,button[aria-disabled="true"]{cursor:default}
:focus-visible{outline:2px solid var(--bleu-tx,#1F4FD8);outline-offset:2px}
.fen :focus-visible{outline:2px solid var(--bleu-tx);outline-offset:2px}
[hidden]{display:none !important}
.mono{font-family:var(--mono);font-weight:500}
.meta{font-size:var(--t-meta);line-height:var(--l-meta)}
.encre2{color:var(--encre2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* petites capitales espacées : étiquettes de section */
.pc{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ───────────────────────────── banc d'essai (hors maquette) */
.banc{display:flex;flex-wrap:wrap;gap:var(--e3) var(--e5);align-items:center;padding:var(--e3) var(--e5);font-size:13px;line-height:18px;border-bottom:1px solid rgba(90,86,78,.3)}
.banc label{display:flex;align-items:center;gap:var(--e2)}
.banc select{background:transparent;border:1px solid rgba(90,86,78,.45);border-radius:3px;padding:3px 6px;max-width:260px}
.banc .seg{display:inline-flex;border:1px solid rgba(90,86,78,.45);border-radius:3px;overflow:hidden}
.banc .seg button{padding:3px 10px;border-radius:0;font-size:13px}
.banc .seg button[aria-pressed="true"]{background:rgba(90,86,78,.22)}
.banc .seg button:focus-visible{outline-offset:-2px}
.plateau{display:flex;gap:var(--e6);padding:var(--e6) var(--e5);align-items:flex-start;flex-wrap:wrap}
.notes{max-width:360px;font-size:13px;line-height:19px;opacity:.9}
.notes h2{font-size:13px;font-weight:600;margin-bottom:var(--e2);letter-spacing:0}
.notes p{margin-bottom:var(--e2)}
.notes .nouveau{display:inline-block;border:1px solid currentColor;border-radius:3px;padding:0 5px;font-size:11px;line-height:16px;vertical-align:1px}
:root[data-nu="1"] .banc,:root[data-nu="1"] .notes{display:none}
:root[data-nu="1"] .plateau{padding:0}
:root[data-nu="1"] body{background:var(--fond)}

/* ───────────────────────────── la fenêtre */
.fen{position:relative;width:600px;height:760px;background:var(--fond);color:var(--encre);display:flex;flex-direction:column;overflow:hidden;flex:none;isolation:isolate}
:root[data-taille="compact"] .fen{width:360px;height:480px}
:root[data-nu="0"] .fen{outline:1px solid rgba(90,86,78,.4)}

/* barre */
.barre{height:var(--barre);flex:none;display:flex;align-items:center;gap:var(--e3);padding:0 var(--e4);border-bottom:1px solid var(--filet)}
:root[data-taille="normal"] .barre{padding:0 var(--e4) 0 var(--e5)}
.logo{display:flex;align-items:center;gap:var(--e2);font-family:var(--titre);font-weight:600;font-size:16px;letter-spacing:0}
.logo svg{width:18px;height:18px;display:block}
:root[data-taille="compact"] .logo span{display:none}
.bascule{display:inline-flex;border-bottom:0;gap:var(--e4)}
.bascule button{height:var(--barre);padding:0 2px;border-radius:0;font-size:var(--t-texte);color:var(--encre2);display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid transparent;margin-bottom:-1px}
.bascule button[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--encre)}
.bascule button[aria-disabled="true"]{color:var(--encre3)}
.bascule button svg{width:11px;height:11px}
.bascule button:focus-visible{outline-offset:-3px}
.espace{flex:1}
.puce{height:28px;display:inline-flex;align-items:center;gap:var(--e2);padding:0 10px 0 8px;border-radius:999px;border:1px solid var(--filet-fort);font-size:var(--t-meta);line-height:1;color:var(--encre);max-width:220px;white-space:nowrap}
.puce i{width:8px;height:8px;border-radius:50%;background:var(--vivant);flex:none}
.puce[data-etat="libre"] i{background:var(--encre3);animation:pulse-une var(--d-glisse) ease-out 2}
.puce[data-etat="ko"] i{background:var(--alerte)}
.puce[data-etat="aucun"] i{background:transparent;border:1.5px solid var(--encre3)}
.puce[data-etat="verrou"] svg{width:11px;height:11px;color:var(--encre2)}
.puce .tx{overflow:hidden;text-overflow:ellipsis}
.puce .fl{width:8px;height:8px;color:var(--encre2)}
:root[data-taille="compact"] .puce{max-width:132px;padding:0 8px 0 7px}
.puce .court{display:none}
:root[data-taille="compact"] .puce .long{display:none} :root[data-taille="compact"] .puce .court{display:inline}
:root[data-taille="compact"] .ico[data-act="palette"]{display:none}
:root[data-taille="compact"] .bascule{gap:var(--e3)}
.ico{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--encre2);border-radius:var(--r-ctl)}
.ico:hover{color:var(--encre);background:var(--surface)}
.ico svg{width:16px;height:16px}
.ico[aria-pressed="true"]{color:var(--encre);background:var(--surface2)}
.barre-note{position:absolute;top:var(--barre);left:0;right:0;padding:var(--e2) var(--marge);font-size:var(--t-meta);line-height:var(--l-meta);color:var(--encre2);background:var(--surface);border-bottom:1px solid var(--filet);z-index:3}

/* instrument */
.instrument{flex:none;padding:var(--marge-v) var(--marge);display:flex;flex-direction:column;gap:var(--e5)}
:root[data-taille="compact"] .instrument{gap:var(--e3)}
.etat{display:flex;align-items:center;gap:var(--e3);min-height:var(--l-etat)}
.etat .mot{font-family:var(--titre);font-size:var(--t-etat);line-height:var(--l-etat);font-weight:600;letter-spacing:-.005em;font-optical-sizing:auto;transition:color var(--d-local) var(--sortie)}
:root[data-serif="1"] .etat .mot{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:calc(var(--t-etat) * 1.25);letter-spacing:0}
.glyphe{width:24px;height:24px;flex:none;display:block;color:var(--encre2);transition:color var(--d-local) var(--sortie)}
:root[data-taille="compact"] .glyphe{width:20px;height:20px}
.glyphe[data-ton="vivant"]{color:var(--vivant)} .glyphe[data-ton="attention"]{color:var(--attention)} .glyphe[data-ton="alerte"]{color:var(--alerte)} .glyphe[data-ton="encre"]{color:var(--encre)}
.glyphe .arc{transition:stroke-dashoffset 250ms linear}
.glyphe .niveau{transition:height 250ms linear,y 250ms linear}
.glyphe.vivant .fond-anneau{animation:vivant 2000ms ease-in-out infinite}
@keyframes vivant{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes pulse-une{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(1)}}
:root[data-reduit="1"] .glyphe.vivant .fond-anneau,:root[data-reduit="1"] .puce i{animation:none}
@media (prefers-reduced-motion:reduce){.glyphe.vivant .fond-anneau,.puce i{animation:none}}
.groupe-etat{display:flex;flex-direction:column;gap:var(--e2)}
.phrase{color:var(--encre2);font-size:var(--t-texte);line-height:var(--l-texte);min-height:var(--l-texte)}
.phrase b{font-weight:600;color:var(--encre)}
.phrase .mono{font-weight:500;color:var(--encre)}

/* l'objet : la trame */
.objet{display:flex;flex-direction:column;gap:var(--e3)}
.compte{display:flex;align-items:baseline;gap:var(--e2);flex-wrap:wrap}
.compte .chiffre{font-family:var(--titre);font-size:var(--t-chiffre);line-height:var(--l-chiffre);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-optical-sizing:auto}
.compte .suite{color:var(--encre2)}
.compte .droite{margin-left:auto;color:var(--encre2);white-space:nowrap}
.compte .droite b{font-weight:600;color:var(--encre)}
.compte .droite .dif{color:var(--attention);font-weight:600}
:root[data-taille="compact"] .compte .droite{flex-basis:100%;margin-left:0;white-space:normal}
.trame{display:flex;flex-direction:column;gap:var(--inter)}
.trame .rang{display:flex;gap:var(--inter);height:var(--cellule)}
.c{width:var(--cellule);height:var(--cellule);flex:none;position:relative;border-radius:1px;background:var(--vivant)}
.c.voie{background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--vivant)}
.c.differe{background:var(--attention)} .c.differe::after{content:"";position:absolute;left:2px;right:2px;top:calc(50% - 1px);height:2px;background:var(--fond)}
.c.saute{background:transparent;box-shadow:inset 0 0 0 1px var(--alerte)} .c.saute::before,.c.saute::after{content:"";position:absolute;left:50%;top:1px;bottom:1px;width:1.5px;margin-left:-.75px;background:var(--alerte);transform:rotate(45deg)} .c.saute::after{transform:rotate(-45deg)}
.c.main{background:transparent;box-shadow:inset 0 0 0 1.5px var(--vivant)} .c.main::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:var(--vivant)}
.c.cours{background:transparent;box-shadow:inset 0 0 0 2px var(--bleu);overflow:hidden} .c.cours::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0) * 100%);background:var(--bleu);transition:height 250ms linear}
.c.incident{background:var(--alerte)} .c.incident::after{content:"";position:absolute;left:calc(50% - 1px);top:2px;width:2px;height:4px;background:var(--fond);box-shadow:0 5px 0 var(--fond)}
.c.relu{background:var(--encre3)} .c.corrige{background:var(--vivant)}
.c.visite{background:transparent;box-shadow:inset 0 0 0 1px var(--encre3)} .c.visite.corrigee{background:var(--encre);box-shadow:none}
.c.neuf{animation:apparait 150ms var(--sortie)}
@keyframes apparait{from{filter:brightness(.6)}}
:root[data-reduit="1"] .c.neuf{animation:none}
@media (prefers-reduced-motion:reduce){.c.neuf{animation:none}}
.reste{height:var(--cellule);flex:1;background:var(--filet);border-radius:1px;position:relative;min-width:var(--cellule)}
.reste.debut{border-radius:1px 0 0 1px} .reste.milieu{border-radius:0} .reste.fin{border-radius:0 1px 1px 0}
.trame-lib{display:flex;gap:var(--e4);color:var(--encre2);font-size:var(--t-meta);line-height:var(--l-meta);flex-wrap:wrap}
.trame-lib span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.trame-lib .c{width:8px;height:8px}
.trame-lib .reste{flex:none;width:16px;height:8px}
.trame[data-total="inconnu"] .reste{display:none}

/* allure */
.allure{color:var(--encre2);font-size:var(--t-texte);line-height:var(--l-texte)}
.allure b{font-weight:600;color:var(--encre);font-variant-numeric:tabular-nums}
.allure .sep{color:var(--encre3)}

/* bloc incident */
.incident{display:flex;flex-direction:column;gap:var(--e3);padding:var(--e3) var(--e4);border:1px solid var(--alerte);border-radius:var(--r-ctl)}
.incident p{color:var(--encre)}
.incident .op{color:var(--encre2)} .incident .op b{color:var(--encre);font-weight:600}

/* trois lignes de fin : tableau imprimé */
.fin{display:grid;grid-template-columns:auto 1fr;gap:0 var(--e4);color:var(--encre2)}
.fin dt,.fin dd{padding:var(--e2) 0;border-bottom:1px solid var(--filet)}
.fin dt{color:var(--encre3)} .fin dd b{color:var(--encre);font-weight:600}
.fin dd .dif{color:var(--attention);font-weight:600}

/* actions */
.actions{display:flex;align-items:center;gap:var(--e4);flex-wrap:wrap}
.principal{height:44px;min-width:200px;padding:0 var(--e5);background:var(--action);color:var(--action-tx);border-radius:var(--r-ctl);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform var(--d-appui) var(--sortie),background var(--d-local) var(--sortie)}
.principal:hover{background:var(--action-survol)}
.principal:active{transform:scale(.98)}
.principal:disabled{background:var(--surface2);color:var(--encre3);box-shadow:inset 0 0 0 1px var(--filet)}
.principal svg{width:14px;height:14px}
.principal .tourne{width:14px;height:14px;border-radius:50%;border:1.75px solid currentColor;border-right-color:transparent;animation:tourne 900ms linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
:root[data-reduit="1"] .tourne{animation:none}
@media (prefers-reduced-motion:reduce){.tourne{animation:none}}
:root[data-taille="compact"] .principal{flex:1 1 200px;min-width:0;height:auto;min-height:44px;padding:8px var(--e4);white-space:normal;text-align:center;line-height:20px}
:root[data-taille="compact"] .actions{gap:var(--e3);flex-wrap:wrap}
:root[data-taille="compact"] .actions .secondaire{flex:none;padding:0 var(--e1)}
:root[data-taille="compact"] .actions .raison{flex-basis:100%}
.secondaire{height:32px;padding:0 var(--e2);color:var(--encre2);border-radius:var(--r-ctl);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color var(--d-local)}
.secondaire:hover{color:var(--encre)} .secondaire:active{text-decoration-color:currentColor}
.secondaire.danger{color:var(--alerte)}
.secondaire:disabled{color:var(--encre3)}
.raison{width:100%;color:var(--encre2);font-size:var(--t-texte);line-height:var(--l-texte)}
.verrou-ligne{display:flex;align-items:center;gap:var(--e2);color:var(--encre2)}
.verrou-ligne svg{width:14px;height:14px}

/* zone du tiroir */
.zone{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#tiroir-corps{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
:root[data-taille="compact"] .zone:has(.tiroir[data-ouvert="1"]){overflow:visible}
:root[data-taille="compact"] .palette .pied{display:none}
.tiroir{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--surface);border-top:1px solid var(--filet-fort);box-shadow:0 -1px 2px rgba(22,23,26,.06);display:flex;flex-direction:column;transform:translateY(calc(100% - var(--poignee)));transition:transform var(--d-glisse) var(--entree-sortie)}
.tiroir[data-ouvert="1"]{transform:none}
.poignee{height:var(--poignee);flex:none;width:100%;display:flex;align-items:center;gap:var(--e3);padding:0 var(--marge);text-align:left;color:var(--encre);font-size:var(--t-texte);border-radius:0}
.poignee:hover{background:var(--surface2)}
.poignee:focus-visible{outline-offset:-3px}
.poignee .fl{width:12px;height:12px;flex:none;color:var(--encre2);transition:transform var(--d-glisse) var(--sortie)}
.tiroir[data-ouvert="1"] .poignee .fl{transform:rotate(90deg)}
.poignee .n{font-family:var(--mono);font-weight:600}
.poignee .n.dif{color:var(--attention)}
.poignee .reste{margin-left:auto;color:var(--encre2);font-size:var(--t-meta);white-space:nowrap;background:none;height:auto;flex:none;border-radius:0;min-width:0}
.poignee .etat-mini{display:none}
.poignee .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poignee .court{display:none}
:root[data-taille="compact"] .poignee .long{display:none} :root[data-taille="compact"] .poignee .court{display:inline}
:root[data-taille="compact"] .ligne .outils button span{display:none}
:root[data-taille="compact"] .ligne .outils button{width:32px;justify-content:center;padding:0}
:root[data-taille="compact"] .ligne .outils svg{width:14px;height:14px}
.corps{flex:1;min-height:0;overflow:auto;padding:0 var(--e4) var(--e4);scrollbar-width:thin}
:root[data-taille="normal"] .corps{padding:0 var(--marge) var(--e4)}
.section{display:flex;align-items:baseline;gap:var(--e3);height:36px;color:var(--encre2);font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--encre);position:sticky;top:0;background:var(--surface);z-index:1;padding-top:var(--e2)}
.section .n{font-family:var(--mono);color:var(--encre);text-transform:none;letter-spacing:0;font-size:var(--t-meta)}
.section .d{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:var(--t-meta)}
.ligne{display:grid;grid-template-columns:72px 1fr auto;gap:0 var(--e3);align-items:center;height:36px;border-bottom:1px solid var(--filet);font-size:var(--t-texte);line-height:var(--l-texte);padding:0 var(--e2);margin:0 calc(-1 * var(--e2));border-radius:var(--r-ctl)}
:root[data-taille="compact"] .ligne{grid-template-columns:60px 1fr auto}
.ligne .cut{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.ligne .motif{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .motif small{color:var(--encre2);font-size:var(--t-meta)}
.ligne .prec{color:var(--encre2);font-size:var(--t-meta);white-space:nowrap;font-variant-numeric:tabular-nums}

<script>
(() => {

/* Glyphes d'état : la forme porte l'état, la couleur confirme. L'anneau « en cours » se remplit avec le temps passé sur le cut (0 → médiane). */

/* ─────────────────────────── simulation du lot (chiffres inventés) */
let graine = 7; const al = () => { graine = (graine * 16807) % 2147483647; return (graine - 1) / 2147483646; };
function lotDeBase() {
  graine = 7; const cuts = []; let n = 4811;
  for (let i = 0; i < 31; i++) { n += 1 + (al() < .35 ? 1 : 0) + (al() < .12 ? 1 : 0); const dif = [7, 12, 19, 26].includes(i); cuts.push({ cut: n, statut: dif ? 'differe' : (al() < .15 ? 'voie' : 'pose'), dur: dif ? 14 + al() * 10 : 5.5 + al() * 6 + (al() < .2 ? 4 : 0), rail: dif ? (al() < .5 ? 'rail droit' : 'rail gauche') : '' }); }
  return { partie: 13, cibles: 120, cuts, encours: { cut: n + 1 + (al() < .4 ? 1 : 0), depuis: 0, attendu: 7.8 }, etat: 'cours', pauseDepuis: 0 };
}
const sim = { lot: lotDeBase(), echo: { visites: [], encours: null }, derniereH: performance.now(), tick: null };
function echoDeBase() { graine = 21; const v = []; let n = 5102; for (let i = 0; i < 148; i++) { n += 1 + (al() < .5 ? 1 : 0); v.push({ cut: n, corrige: al() < .41, dur: 6 + al() * 12 }); } sim.echo = { visites: v, encours: { cut: n + 1, depuis: 4, attendu: 11 } }; }
echoDeBase();
const medianeLot = () => { const d = sim.lot.cuts.slice(-20).map(c => c.dur); return d.length >= 3 ? quantile(d, .5) : null; };
const medianeEcho = () => { const d = sim.echo.visites.slice(-20).map(c => c.dur); return d.length >= 3 ? quantile(d, .5) : null; };
function avancer(dt) {

/* ─────────────────────────── rendu */
const glypheHtml = (m, cls = '') => `<span class="glyphe ${m.glyphe === 'cours' || m.glyphe === 'echo' ? 'vivant' : ''} ${cls}" data-ton="${m.ton}" aria-hidden="true">${GLYPHE[m.glyphe]}</span>`;
/* La trame : un carré par cut traité, dans l'ordre du lot ; les restants forment une seule barre grise (fiche des compteurs, § 2).

function colonnes() {

  return Math.max(8, Math.floor((W + gap) / (cel + gap)));
}
function trame(cellules, restants, label, inconnu) {
  const cols = colonnes(), rangs = [];

    if (rangs.length > 40) break;

    const L = FEN.querySelectorAll('.cmd[data-cmd]');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { S.pi = Math.max(0, Math.min(L.length - 1, S.pi + (e.key === 'ArrowDown' ? 1 : -1))); rendre(); e.preventDefault(); }
    else if (e.key === 'Enter') { const c = L[Math.max(0, Math.min(L.length - 1, S.pi))]; if (c && c.getAttribute('aria-disabled') !== 'true' && c.dataset.act) { S.couche = null; S.q = ''; S.pi = 0; agir(c.dataset.act); } e.preventDefault(); }
    return;
  }
  if (S.tiroir && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.target.closest('input,select')) {
    const n = FEN.querySelectorAll('#tiroir-corps [data-row]').length; if (!n) return;
    S.sel = Math.max(0, Math.min(n - 1, (S.sel ?? -1) + (e.key === 'ArrowDown' ? 1 : -1))); rendre(); FEN.querySelector(`[data-row="${S.sel}"]`)?.scrollIntoView({ block: 'nearest' }); e.preventDefault();
  }
  if (S.tiroir && R.dataset.revue === 'v2' && S.sel !== null && (e.key === 'e' || e.key === 'E') && !e.target.closest('input,select')) { const b = FEN.querySelector(`[data-row="${S.sel}"] [data-examine]`); if (b) b.click(); }
});

/* ─────────────────────────── banc d'essai */
function regler(k, v) {
  if (k === 'taille') R.dataset.taille = v; if (k === 'theme') R.dataset.theme = v; if (k === 'revue') R.dataset.revue = v; if (k === 'cadence') R.dataset.cadence = v;
  D.querySelectorAll(`.banc [data-${k}]`).forEach(b => b.setAttribute('aria-pressed', b.dataset[k] === v));
  rendre();
}
function scene(id) {
  S.scene = id; S.couche = id === 'palette' ? 'palette' : id === 'reglages' ? 'reglages' : id === 'cache' ? 'cache' : id === 'esv' ? 'esv' : null; S.tiroir = false; S.sel = null; S.note = ''; S.exportFait = false;
  if (id === 'cours' || id === 'palette') { sim.lot = lotDeBase(); sim.lot.etat = 'cours'; } else if (id === 'pause') { sim.lot = lotDeBase(); sim.lot.etat = 'pause'; sim.lot.pauseDepuis = 80; } else if (id === 'incident' || id === 'interrompu' || id === 'esv-muet') { sim.lot = lotDeBase(); sim.lot.etat = 'incident'; }
  if (id === 'echo') echoDeBase();
  D.getElementById('sc-scene').value = id; rendre();
}
const sel = D.getElementById('sc-scene'); sel.innerHTML = SCENES.map(([k, t]) => `<option value="${k}">${esc(t)}</option>`).join(''); sel.addEventListener('change', () => scene(sel.value));
D.querySelectorAll('.banc .seg button').forEach(b => b.addEventListener('click', () => { const k = Object.keys(b.dataset)[0]; regler(k, b.dataset[k]); }));
D.getElementById('sc-reduit').addEventListener('change', e => { if (e.target.checked) R.dataset.reduit = '1'; else delete R.dataset.reduit; });
D.getElementById('sc-serif').addEventListener('change', e => { if (e.target.checked) R.dataset.serif = '1'; else delete R.dataset.serif; });
if (new URLSearchParams(location.search).get('serif') === '1') { R.dataset.serif = '1'; D.getElementById('sc-serif').checked = true; }
const P = new URLSearchParams(location.search);
R.dataset.nu = P.get('nu') === '1' ? '1' : '0';
if (P.get('taille')) regler('taille', P.get('taille')); if (P.get('theme')) regler('theme', P.get('theme')); if (P.get('revue')) regler('revue', P.get('revue')); if (P.get('cadence')) regler('cadence', P.get('cadence'));
if (P.get('reduit') === '1') { R.dataset.reduit = '1'; D.getElementById('sc-reduit').checked = true; }
scene(SCENES.some(s => s[0] === P.get('scene')) ? P.get('scene') : 'cours');
if (P.get('tiroir') === '1') { S.tiroir = true; rendre(); }
if (P.get('fige') === '1') { /* captures : on fige l'avancement au premier dessin */ } else sim.tick = setInterval(boucle, 250);
window.ArianeMaquette = { S, sim, scene, rendre };
})();
